name: Photon SDK parity

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python -m pip install \
            'homeassistant==2026.2.3' 'grpcio>=1.75.1,<2' \
            'protobuf>=6.31.1,<7' pytest
      - run: |
          npm install --prefix tests/sdk_parity \
            --no-save --package-lock=false --ignore-scripts \
            --no-audit --no-fund \
            '@spectrum-ts/core@latest' '@spectrum-ts/imessage@latest' \
            '@photon-ai/advanced-imessage@latest'
      - run: python -m pytest -q tests/sdk_parity/parity.py
